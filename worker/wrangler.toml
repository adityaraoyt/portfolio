name = "portfolio-chat"
main = "src/index.ts"
compatibility_date = "2024-08-01"

[vars]
ALLOWED_ORIGINS = "https://adityaraoyt.github.io,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8787"
